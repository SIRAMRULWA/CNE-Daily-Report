version: '3.8'

services:
  vodacom-fe:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
        API_PROXY_URL: ${API_PROXY_URL}
    image: vodacom-itil-reports-fe:qa
    container_name: vodacom-itil-reports-fe-qa
    restart: unless-stopped
    env_file:
      - .env.qa
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
    ports:
      - "3001:3000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - itil-shared-net
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000/healthz').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

networks:
  itil-shared-net:
    external: true