version: 2

models:
  - name: stg_work_orders
    description: >
      Normalised view over staging.raw_work_orders. One row per Work Order.
      Source for all Work Order marts.
    columns:
      - name: work_order_id
        description: Helix Work Order ID (WO...)
        tests:
          - not_null
          - unique
      - name: sla_status
        description: >
          Target-date SLA status. Open: WITHIN_SLA / NEARING_SLA / BREACHED /
          NO_TARGET_DATE. Completed: MET_TARGET / MISSED_TARGET / NO_TARGET_DATE.
          Anything else: OUT_OF_SCOPE.
        tests:
          - accepted_values:
              arguments:
                values: ['WITHIN_SLA', 'NEARING_SLA', 'BREACHED', 'NO_TARGET_DATE', 'MET_TARGET', 'MISSED_TARGET', 'OUT_OF_SCOPE']
              config:
                severity: warn

  - name: wo_report_records
    description: >
      Daily snapshot of open, in-scope Work Orders. Grain: one row per
      (report_date, work_order_id). Each snapshot only uses rows loaded on that
      WORKSPACE_TIMEZONE date. Powers /api/v1/daily-reports/records.
    columns:
      - name: report_date
        tests: [not_null]
      - name: work_order_id
        tests: [not_null]
      - name: division
        tests: [not_null]
      - name: support_group
        tests: [not_null]
      - name: sla_status
        tests:
          - accepted_values:
              arguments:
                values: ['WITHIN_SLA', 'NEARING_SLA', 'BREACHED', 'NO_TARGET_DATE']

  - name: wo_report_summary
    description: >
      Report grid: open Work Orders by SLA status per support group.
      Grain: one row per (report_date, division, support_group).
      Powers /api/v1/daily-reports.
    columns:
      - name: report_date
        tests: [not_null]
      - name: division
        tests: [not_null]
      - name: support_group
        tests: [not_null]
      - name: total_open
        tests: [not_null]

  - name: wo_completed
    description: >
      Work Orders completed in the previous scheduled 24-hour window, marked
      MET_TARGET, MISSED_TARGET or NO_TARGET_DATE.
      Grain: one row per (report_date, work_order_id).
    columns:
      - name: report_date
        tests: [not_null]
      - name: work_order_id
        tests: [not_null]
      - name: window_start
        tests: [not_null]
      - name: window_end
        tests: [not_null]
      - name: sla_status
        tests:
          - accepted_values:
              arguments:
                values: ['MET_TARGET', 'MISSED_TARGET', 'NO_TARGET_DATE']
